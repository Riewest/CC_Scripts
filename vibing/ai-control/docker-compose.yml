services:
  ai-control:
    build: .
    restart: unless-stopped
    ports:
      - "${AIC_PORT:-8000}:${AIC_PORT:-8000}"
    volumes:
      - ai-control-data:/app/data
    environment:
      AIC_DATABASE_URL: sqlite:////app/data/aicontrol.db
      AIC_WEB_DIST_DIR: /app/server/src/aicontrol/static
      AIC_CLIENT_DIST_DIR: /app/server/src/aicontrol/client_dist
      AIC_HOST: ${AIC_HOST:-0.0.0.0}
      AIC_PORT: ${AIC_PORT:-8000}
      AIC_MAX_WS_MESSAGE_BYTES: ${AIC_MAX_WS_MESSAGE_BYTES:-131072}
      AIC_HELLO_TIMEOUT_S: ${AIC_HELLO_TIMEOUT_S:-5}
      AIC_HEARTBEAT_INTERVAL_S: ${AIC_HEARTBEAT_INTERVAL_S:-30}
      AIC_HEARTBEAT_TIMEOUT_S: ${AIC_HEARTBEAT_TIMEOUT_S:-90}
      AIC_ENVIRONMENT: ${AIC_ENVIRONMENT:-development}
      AIC_ALLOW_SIGNUP: ${AIC_ALLOW_SIGNUP:-false}
      AIC_PUBLIC_URL: ${AIC_PUBLIC_URL:-http://localhost:8000}
      AIC_SECRET_ENCRYPTION_KEY: ${AIC_SECRET_ENCRYPTION_KEY:-}
      AIC_OIDC_PROVIDERS: ${AIC_OIDC_PROVIDERS:-[]}

volumes:
  ai-control-data:
